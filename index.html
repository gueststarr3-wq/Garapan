<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#050505}
body{min-height:100vh;display:flex;justify-content:center}
.lp{position:relative;width:min(100%,1024px);overflow:hidden;line-height:0}
.hero{display:block;width:100%;height:auto;transform:scale(1);animation:slowZoom 8s ease-in-out infinite alternate;transform-origin:center center;will-change:transform}
@keyframes slowZoom{
  from{transform:scale(1)}
  to{transform:scale(1.025)}
}
/* Very subtle ambient glow; does not move the CTA hit areas. */
.lp::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 72% 28%,rgba(255,20,135,.08),transparent 28%);
  animation:glow 5s ease-in-out infinite alternate;
}
@keyframes glow{
  from{opacity:.45} to{opacity:1}
}
.hit{position:absolute;display:block;z-index:10;border-radius:18px;text-decoration:none;cursor:pointer}
.hit:focus{outline:3px solid #fff;outline-offset:3px}
.free{left:4%;top:38.7%;width:46%;height:5.9%}
.login{left:4%;top:45.2%;width:46%;height:5.4%}
.join{left:70%;top:48.4%;width:27%;height:6.0%}
.bottom{left:4%;top:84.6%;width:72%;height:7.2%}
.floating{
  left:79%;top:84.7%;width:18%;height:8.3%;border-radius:50%;
  animation:floatAttention 3.8s ease-in-out infinite;
  transform-origin:center center;
  will-change:transform;
}
@keyframes floatAttention{
  0%,100%{transform:translateY(0) scale(1)}
  45%{transform:translateY(-4px) scale(1.015)}
  55%{transform:translateY(-4px) scale(1.015)}
}

@media (prefers-reduced-motion: reduce){
  .hero,.lp::after,.floating{animation:none}
}
</style>
</head>
